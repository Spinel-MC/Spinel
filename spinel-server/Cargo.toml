[package]
name = "spinel-server"
version = "0.1.0"
edition = "2024"

[features]
default = ["server"]
server = []
client = []

[dependencies]
spinel-core = { path = "../spinel-core" }
spinel-registry = { path = "../spinel-registry" }
spinel-network = { path = "../spinel-network" }
spinel-utils = { path = "../spinel-utils" }
spinel-macros = { path = "../spinel-macros" }
spinel-nbt = { path = "../spinel-nbt" }
spinel-events = { path = "../spinel-events" }
tokio = { version = "1", features = ["full"] }
rsa = "0.9"
rand = "0.9.2"
inventory = "0.3"
libm = "0.2.16"
uuid = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
thiserror = "2"
flate2 = "1"
log = "0.4"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

